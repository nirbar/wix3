version: 3.12.0.{build}
configuration: Release
clone_depth: 1
skip_tags: true
skip_non_tags: true
image: Visual Studio 2019

environment:
  my_salt:
    secure: sjYu7KIWTpqq5s6CSyVapacjdBXPd3SlKA2JDuUlCKG9P8q5sg4HbXucl8tuyrEuk4V90BHtHTaR5AI8jlbb+g==
  my_psw:
    secure: 6u2k6uaCy0GJj3/eaSjsmA==
  OFFICIAL_WIX_BUILD: '%APPVEYOR_BUILD_FOLDER%\psw-wix.snk'
  NUPKG_VERSION: '3.12.0-c%APPVEYOR_BUILD_NUMBER%'
  SKIP_VS_CHECK: true
      
install:
- ps: iex ((New-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/appveyor/secure-file/master/install.ps1'))
- cmd: curl.exe -fsS -o nuget-latest.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe

before_build:
- cmd: appveyor-tools\secure-file -decrypt .\psw-wix.snk.enc -secret %my_psw% -salt %my_salt%

build:
  project: wix.proj
  verbosity: normal

before_package:
- cmd: .\nuget-latest.exe pack "%APPVEYOR_BUILD_FOLDER%\src\Setup\Nupkg\WiX.nuspec" -Version "%NUPKG_VERSION%" -BasePath "%APPVEYOR_BUILD_FOLDER%" -OutputDirectory "%APPVEYOR_BUILD_FOLDER%\build\nuget-out"

test: off

artifacts:
- path: build\nuget-out\PanelSW.Custom.WiX.%NUPKG_VERSION%.nupkg
  name: PanelSW.Custom.WiX.%NUPKG_VERSION%.nupkg
